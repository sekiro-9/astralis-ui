name: Storybook

# Builds the library's Storybook and publishes it to GitHub Pages, where the
# docs site's component pages link to it. Pages must be set to "GitHub Actions"
# as its source (Settings -> Pages) for the deploy job to be allowed.
on:
  push:
    branches: [main]
    paths:
      - "packages/astralis-ui/**"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter astralis-ui build-storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/astralis-ui/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
