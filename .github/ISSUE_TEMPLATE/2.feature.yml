name: Feature request
description: Suggest a component, a prop, a block or an improvement to the tooling.
title: "[feature] "
labels: [enhancement, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. The problem you are trying to solve matters more than the solution you picture, so start there.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched the [existing issues](https://github.com/sekiro-9/astralis-ui/issues?q=is%3Aissue) and the [docs](https://astralis-ui.com/docs), and this doesn't exist yet.
          required: true

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - astralis-ui
        - astralis-cli
        - create-astralis
        - astralis-mcp
        - astralis-devtools
        - Blocks
        - Docs site
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you picture it working. A sketch of the API you'd want helps.
      render: tsx
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and prior art
      description: Workarounds you use now, or how other libraries handle it.

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - "Yes, I'd like to open a pull request"
        - "Maybe, with some guidance"
        - "No"
