name: Feature request
description: Suggest a component, a prop, a block or an improvement to the tooling.
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - astralis-ui
        - astralis-cli
        - astralis-mcp
        - astralis-devtools
        - create-astralis
        - Blocks
        - Docs site
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you picture it working. A code sample of the API you'd want helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how other libraries handle it.
